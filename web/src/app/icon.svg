<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="QamoosTech">
  <defs>
    <linearGradient id="qt-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5794f"/>
      <stop offset="1" stop-color="#a8411c"/>
