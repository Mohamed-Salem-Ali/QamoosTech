<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QamoosTech share card</title>
<!--
  The 1200x630 share card (public/og.png) used by every page's Open Graph / Twitter tags.
  Rendered by scripts/brand/render.mjs. System fonts only: headless Chrome renders with no network.
-->
<style>
  :root { --bg:#13110f; --ink:#ede6da; --mute:#a09486; --clay:#e5794f; --ochre:#e0ae52; --sage:#7cc79a; --line:#302a24; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body { position: relative; font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  .glow { position: absolute; border-radius: 50%; }
  .glow.a { width: 760px; height: 760px; left: -220px; top: -300px; background: radial-gradient(circle, rgb(229 121 79 / .28), transparent 62%); }
  .glow.b { width: 640px; height: 640px; right: -180px; bottom: -320px; background: radial-gradient(circle, rgb(224 174 82 / .16), transparent 62%); }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgb(255 255 255 / .07) 1px, transparent 1.4px); background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse 70% 80% at 30% 40%, #000 10%, transparent 75%); }
  .wrap { position: absolute; inset: 0; padding: 84px 92px; display: flex; flex-direction: column; justify-content: space-between; }
  .head { display: flex; align-items: center; gap: 30px; }
  .head img { width: 132px; height: 132px; filter: drop-shadow(0 18px 40px rgb(229 121 79 / .35)); }
  .name { font-size: 74px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .name b { color: var(--clay); }
  .ar { margin-top: 12px; font-size: 40px; color: var(--mute); direction: rtl; text-align: left; }
  .lines { display: grid; gap: 10px; }
  .en { font-size: 34px; line-height: 1.3; max-width: 900px; }
  .ar2 { font-size: 32px; color: var(--mute); direction: rtl; text-align: left; }
  .foot { display: flex; justify-content: space-between; align-items: center; border-top: 1.5px solid var(--line); padding-top: 26px; font-size: 24px; color: var(--mute); }
  .foot .pill { color: var(--ink); }
  .foot .pill i { font-style: normal; color: var(--ochre); padding: 0 .4em; }
  .foot .url { display: flex; align-items: center; gap: 12px; }
  .foot .url::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--sage); box-shadow: 0 0 0 5px rgb(124 199 154 / .18); }
</style>
</head>
<body>
  <div class="glow a"></div><div class="glow b"></div><div class="dots"></div>
  <div class="wrap">
    <div class="head">
      <img src="../../public/logo.svg" alt="">
      <div>
        <div class="name">Qamoos<b>Tech</b></div>
        <div class="ar">قاموس تك</div>
      </div>
    </div>
    <div class="lines">
      <div class="en">The English words software engineers use every day, explained in Arabic and English.</div>
      <div class="ar2">افهم الكلمات الإنجليزية التي يستخدمها المبرمجون كل يوم</div>
    </div>
    <div class="foot">
      <span class="pill">Definitions<i>·</i>Pronunciation<i>·</i>Real examples</span>
      <span class="url">qamoostech.mohamedyounes.dev</span>
    </div>
  </div>
</body>
</html>
